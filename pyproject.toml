[project]
name = "elderly-monitor"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyarrow", "opencv-python", "ultralytics", "pyyaml", "pydantic>=2", "anthropic"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
